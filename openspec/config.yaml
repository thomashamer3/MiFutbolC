# openspec/config.yaml
# Generated by sdd-init (hybrid persistence mode) for project "mifutbolc".
# Verified against the working tree on 2026-09-21. See notes.md for stale-doc warnings.

schema: spec-driven

strict_tdd: false

context: |
  Project: MiFutbolC 4.3 - console-based (CLI) football management system in pure C.
  Stack: C11 with CMAKE_C_EXTENSIONS OFF; CMake >= 3.20 + Ninja (primary), GNU Make (secondary), Code::Blocks (legacy).
  Embedded libraries: SQLite3 amalgamation, cJSON, miniaudio (header-only), custom pdfgen.
  Architecture: flat root module layout; presentation (menu/utils) -> feature modules -> db.c singleton -> sqlite3.
  Testing: Unity 2.6.2 subset at tests/unity/; 8 per-module test executables; opt-in via MIFUTBOLC_BUILD_TESTS (default OFF).
  Strict TDD: disabled - no TDD config/marker, no CI, tests are opt-in, and no workspace-level test command is declared.
  Style: snake_case files/functions/variables, PascalCase types, SCREAMING_SNAKE_CASE macros; Spanish comments; Doxygen on headers.

projects:
  - path: "."
    stack: "C11 + CMake (Ninja) / Make"
    test_command: "cmake --preset mingw-debug -DMIFUTBOLC_BUILD_TESTS=ON && cmake --build --preset build-debug && ctest --test-dir build/debug --output-on-failure"
    test_framework: "Unity 2.6.2 (vendored subset)"
    notes: "Tests default OFF (CMakeLists.txt:9). No CMake testPresets exist, so ctest must target the binary dir."

rules:
  proposal:
    - Include rollback plan for risky changes
    - State whether the change touches the flat root, db.c schema, or an embedded library
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Preserve the module anatomy: menu_<modulo>() + CRUD + MenuItem[] sentinel {0, "Volver", NULL}
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing module patterns (camiseta.c is the simplest CRUD reference)
      - Use db_prepare_stmt()/db_prepare_cached(); never concatenate user data into SQL
      - Use ui_printf/input_* wrappers; never raw printf/scanf for UI
      - Keep Spanish comment convention; do not restyle existing comments
    tdd: false
    test_command: "ctest --test-dir build/debug --output-on-failure"
  verify:
    test_command: "ctest --test-dir build/debug --output-on-failure"
    build_command: "cmake --build --preset build-debug"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  detected: "2026-09-21"
  enable_flag: "MIFUTBOLC_BUILD_TESTS=ON"
  runner: "CTest (CMake enable_testing/add_test at CMakeLists.txt:142-166)"
  test_dir: "build/debug"
  layers:
    unit: "Unity 2.6.2 - 8 executables (test_camiseta, test_cancha, test_equipo, test_lesion, test_partido, test_temporada, test_torneo, test_utils)"
    integration: "none configured"
    e2e: "none configured"
  coverage: "none configured"
  linter: "none configured in-repo (clang-tidy available via project skill, not wired to build)"
  formatter: "none configured"
  ci: "none detected (.github/ absent)"
