name: SonarCloud
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    env:
      SONAR_SCANNER_HOME: ${{ runner.temp }}/sonar-scanner
      BUILD_WRAPPER_HOME: ${{ runner.temp }}/build-wrapper
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake ninja-build
      - name: Cache sonar-scanner & build-wrapper
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/sonar-scanner
            ${{ runner.temp }}/build-wrapper
          key: ${{ runner.os }}-sonar-${{ hashFiles('sonar-project.properties') }}
      - name: Download sonar-scanner
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux-x64.zip" -o /tmp/sonar-scanner.zip
          unzip -q /tmp/sonar-scanner.zip -d ${{ runner.temp }}
          mv ${{ runner.temp }}/sonar-scanner-* $SONAR_SCANNER_HOME
      - name: Download build-wrapper
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip" -o /tmp/bw.zip
          unzip -q /tmp/bw.zip -d ${{ runner.temp }}
          mv ${{ runner.temp }}/build-wrapper-* $BUILD_WRAPPER_HOME
      - name: Build with build-wrapper
        run: |
          cmake --preset linux-debug
          $BUILD_WRAPPER_HOME/build-wrapper-linux-x86-64 --out-dir bw-output \
            cmake --build build/linux-debug
      # Coverage disabled for now — requires gcov/lcov setup
      - name: Run sonar-scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $SONAR_SCANNER_HOME/bin/sonar-scanner
